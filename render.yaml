services:
  - type: web
    name: coluncer-sitio
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      # Se pide al crear el servicio; pégalo en el panel de Render, no aquí.
      - key: WOMPI_INTEGRITY_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_TO
        value: gerencia@coluncer.com
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: WOMPI_EVENTS_SECRET
        sync: false
