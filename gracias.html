<!DOCTYPE html>
<html lang="es">
<head>
<!-- Google Tag Manager -->
<script async src="https://www.googletagmanager.com/gtm.js?id=GTM-5ZBPG4B8"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
</script>
<!-- End Google Tag Manager -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>{{TITLE}} · COLUNCER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--V:#6B46E3;--VD:#4F2FC0;--L:#C6ED2E;--K:#15171F;--G:#54545A;--M:#6E707A;--B:#F4F5F1;--LN:#E7E8E2;--ok:#1F8A4C;--wait:#B7791F;--bad:#C0392B}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;color:var(--K);background:var(--B);-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2{font-family:'Archivo',sans-serif;font-weight:900;letter-spacing:-.02em}
a{color:inherit;text-decoration:none}
header{background:var(--K);color:#fff;padding:16px 0}
.wrap{max-width:720px;margin:0 auto;padding:0 22px}
.hrow{display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Archivo';font-weight:900;font-size:1.2rem}
.logo b{color:var(--L)}
.back{font-size:.82rem;font-weight:700;opacity:.85}
main{padding:34px 0 70px}
.card{background:#fff;border:1px solid var(--LN);border-radius:22px;padding:34px 30px;text-align:center}
.icon{width:68px;height:68px;border-radius:50%;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;font-size:2rem;color:#fff;font-weight:900}
.s-aprobado .icon{background:var(--ok)} .s-pendiente .icon{background:var(--wait)} .s-rechazado .icon{background:var(--bad)}
h1{font-size:clamp(1.7rem,5vw,2.3rem);line-height:1.05;margin-bottom:12px}
.lead{color:var(--G);line-height:1.6;max-width:520px;margin:0 auto}
.ref{display:inline-block;margin-top:16px;background:var(--B);border:1px solid var(--LN);border-radius:100px;padding:7px 16px;font-size:.8rem;color:var(--M)}
.ref b{color:var(--K)}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:'Archivo';font-weight:800;font-size:.9rem;padding:14px 24px;border-radius:100px;border:0;cursor:pointer}
.btn-lime{background:var(--L);color:var(--K)} .btn-ink{background:var(--K);color:#fff}
.btn:disabled{opacity:.6;cursor:wait}
.order{margin-top:22px;text-align:left;background:var(--B);border:1px solid var(--LN);border-radius:14px;padding:16px 18px;font-size:.88rem;display:none}
.order h2{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--M);margin-bottom:8px}
.order li{list-style:none;padding:3px 0;color:var(--G)}
.order .tot{margin-top:8px;font-weight:800;color:var(--K)}
.btn-wa{background:#25D366;color:#fff}
.track-note{margin-top:14px;font-size:.82rem;color:var(--M);line-height:1.5}
@media(max-width:560px){.card{padding:28px 20px}}
</style>
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
</head>
<body class="t-app t-gracias s-{{STATE}}">
<header><div class="wrap hrow"><a class="logo" href="/">COLUNCER<b>.</b></a><a class="back" href="/">← Volver al sitio</a></div></header>

<main><div class="wrap">
  <section class="card">
    <div class="icon" aria-hidden="true">{{ICON}}</div>
    <h1>{{TITLE}}</h1>
    <p class="lead" id="lead">{{LEAD}}</p>
    <span class="ref" id="refBox" style="display:none">Referencia de tu pedido: <b id="refTxt"></b></span>

    <div class="order" id="orderBox"><h2>Tu pedido</h2><ul id="orderLines"></ul><div class="tot" id="orderTot"></div></div>

    

    <div class="actions" id="mainActions">{{ACTIONS}}</div>
  </section>
</div></main>

<script>
(function(){
  var STATE = "{{STATE}}", WA = "{{WA}}";
  var q = new URLSearchParams(location.search);
  var txId = (q.get("id") || "").replace(/[^A-Za-z0-9_-]/g,"").slice(0,64);
  var ref = (q.get("ref") || "").replace(/[^A-Za-z0-9_-]/g,"").slice(0,80);
  var cop = function(n){ return "$" + Math.round(n).toLocaleString("es-CO"); };
  var esc = function(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); };

  /* Pedido guardado en este navegador al pagar (válido 24 h). Si la URL no trae ref, se usa el último pedido reciente. */
  var order = null;
  try {
    var o = JSON.parse(localStorage.getItem("coluncer_last_order") || "null");
    if (o && (Date.now() - (o.ts || 0)) < 864e5 && (!ref || o.ref === ref)) { order = o; if (!ref && o.ref) ref = String(o.ref).replace(/[^A-Za-z0-9_-]/g,"").slice(0,80); }
  } catch(e){}
  var who = ""; try { var sh = JSON.parse(localStorage.getItem("coluncer_ship") || "null"); if (sh && sh.nombre) who = String(sh.nombre); } catch(e){}

  if (ref) { document.getElementById("refBox").style.display = "inline-block"; document.getElementById("refTxt").textContent = ref; }
  if (STATE === "rechazado" && q.get("cancelado")) {
    document.getElementById("lead").textContent = "Cerraste la ventana de pago antes de terminar, por eso no se realizó ningún cobro. Puedes intentarlo de nuevo cuando quieras.";
  }
  if (order && STATE !== "rechazado") {
    document.getElementById("orderLines").innerHTML = (order.lines || []).map(function(l){ return "<li>" + esc(l) + "</li>"; }).join("");
    document.getElementById("orderTot").textContent = (STATE === "aprobado" ? "Total pagado: " : "Total: ") + cop(order.total || 0);
    document.getElementById("orderBox").style.display = "block";
  }

  /* Enlace "Rastrear mi pedido por WhatsApp" con la referencia ya escrita */
  var links = document.querySelectorAll("a[data-track]");
  if (links.length) {
    var msg = "¡Hola COLUNCER! Quiero rastrear mi pedido" + (ref ? " con referencia " + ref : "") + "."
      + (who ? "\nNombre: " + who : "")
      + (order ? "\n" + (order.lines || []).map(function(l){ return "• " + l; }).join("\n") + "\nTotal: " + cop(order.total || 0) : "")
      + (txId ? "\nTransacción Wompi: " + txId : "");
    var url = "https://wa.me/" + WA + "?text=" + encodeURIComponent(msg);
    for (var i = 0; i < links.length; i++) { links[i].href = url; links[i].target = "_blank"; links[i].rel = "noopener"; }
  }
})();
</script>
</body>
</html>
