  <h1>Servicio de firma de integridad — Wompi</h1>
  <p>Este servicio expone un único endpoint privado usado por la tienda de COLUNCER para
  generar la firma de integridad de Wompi de forma segura, sin exponer el secreto en el navegador.</p>
  <p><code>POST /api/wompi-signature</code> — body: <code>{ reference, amountInCents, currency }</code></p>
</body>
